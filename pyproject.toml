# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-translate-unofficial"
version = "1.0.1"
description = "Unofficial Google Translate. No API key required."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=3.0.0"]
docx = ["docx2txt>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["google_translate*"]